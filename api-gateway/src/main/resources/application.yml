server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/v1/auth/**

eureka:
  client:
    register-with-eureka: true # Fixed Indentation
    fetch-registry: true       # Fixed Indentation
    service-url:
      defaultZone: http://localhost:8761/eureka/